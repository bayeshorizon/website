<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BayesHorizon — Bayesian time-series forecasting. Coming soon.">
  <meta name="theme-color" content="#A0C1B9">
  <title>BayesHorizon — Coming Soon</title>
  <style>
    :root {
      --sage: #A0C1B9;
      --sage-deep: #54756e;
      --sage-dark: #294740;
      --sage-pale: #e8f0ee;
      --paper: #f8faf9;
      --ink: #16221f;
      --muted: #677670;
      --line: rgba(84, 117, 110, 0.18);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 20%, rgba(160, 193, 185, 0.34), transparent 28rem),
        radial-gradient(circle at 14% 88%, rgba(160, 193, 185, 0.2), transparent 24rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      display: grid;
      grid-template-rows: 1fr auto;
      width: min(1180px, calc(100% - 40px));
      min-height: 100vh;
      margin: 0 auto;
    }

    main {
      display: grid;
      place-items: center;
      padding: 72px 0 112px;
    }

    .hero {
      position: relative;
      z-index: 1;
      width: min(820px, 100%);
      text-align: center;
    }

    .coming-soon {
      margin: 0 0 24px;
      color: var(--sage-deep);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(60px, 10vw, 112px);
      font-weight: 770;
      line-height: 0.92;
      letter-spacing: -0.075em;
    }

    .description {
      max-width: 520px;
      margin: 30px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .horizon {
      position: relative;
      width: min(700px, 94%);
      height: 128px;
      margin: 48px auto 0;
    }

    .horizon::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 15px;
      left: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--sage), transparent);
    }

    .horizon svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 76px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    footer strong { color: var(--sage-dark); font-weight: 750; }

    @media (max-width: 640px) {
      .page { width: min(100% - 28px, 1180px); }
      main { padding: 54px 0 80px; }
      h1 { font-size: clamp(54px, 18vw, 78px); }
      .description { max-width: 340px; font-size: 14px; }
      .horizon { height: 100px; margin-top: 38px; }
      footer { align-items: flex-start; flex-direction: column; justify-content: center; gap: 6px; padding: 20px 0; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .forecast-line {
        stroke-dasharray: 720;
        stroke-dashoffset: 720;
        animation: draw 2.2s cubic-bezier(.2,.8,.2,1) .2s forwards;
      }

      .forecast-band {
        opacity: 0;
        animation: reveal 1.2s ease 1s forwards;
      }

      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes reveal { to { opacity: 1; } }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="coming-soon">Coming soon</p>
        <h1 id="page-title">BayesHorizon</h1>
        <p class="description">Bayesian time-series forecasting for univariate and multivariate data.</p>

        <div class="horizon" aria-hidden="true">
          <svg viewBox="0 0 700 128" fill="none" preserveAspectRatio="none">
            <defs>
              <linearGradient id="band" x1="216" y1="0" x2="686" y2="0" gradientUnits="userSpaceOnUse">
                <stop stop-color="#A0C1B9" stop-opacity=".54"/>
                <stop offset="1" stop-color="#A0C1B9" stop-opacity=".05"/>
              </linearGradient>
              <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
                <stop stop-color="#54756E" stop-opacity="0"/>
                <stop offset=".15" stop-color="#54756E"/>
                <stop offset=".86" stop-color="#54756E"/>
                <stop offset="1" stop-color="#54756E" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path class="forecast-band" d="M216 61C292 35 350 46 414 33C489 17 555 31 686 11V107C571 90 497 98 420 86C344 75 283 91 216 71Z" fill="url(#band)"/>
            <path class="forecast-line" d="M14 80C39 66 59 83 83 70C108 55 129 76 153 60C177 46 199 68 223 62C281 48 325 62 376 51C434 39 477 53 526 43C579 33 621 44 686 28" stroke="url(#fade)" stroke-width="3" stroke-linecap="round"/>
            <path d="M216 19V112" stroke="#54756E" stroke-opacity=".35" stroke-dasharray="4 6"/>
          </svg>
        </div>
      </section>
    </main>

    <footer>
      <span><strong>BayesHorizon</strong> · 2026</span>
      <span>GNU Affero General Public License v3.0</span>
    </footer>
  </div>
</body>
</html>
